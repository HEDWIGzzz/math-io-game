<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math.io - Admin Control Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap');
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: #0f0c1b; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-container {
            display: flex; gap: 20px; width: 100%; max-width: 1050px; justify-content: center; flex-wrap: wrap;
        }
        .admin-box {
            background: #221e3f; padding: 25px; border-radius: 16px; text-align: center;
            display: flex; flex-direction: column; gap: 14px; border: 3px solid #e74c3c;
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.4); width: 100%; max-width: 480px;
        }
        h2 { color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .form-group { text-align: left; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #d7bde2; font-weight: bold; }
        input {
            padding: 10px; font-size: 15px; border-radius: 8px; border: 2px solid #9b59b6;
            text-align: center; font-family: 'Kanit', sans-serif; background: #151328; color: white; outline: none; width: 100%;
        }
        .action-btn {
            padding: 12px; font-size: 16px; font-family: 'Kanit', sans-serif; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; background: linear-gradient(135deg, #e74c3c, #d35400);
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: 0.2s; margin-top: 5px;
        }
        .action-btn:hover { transform: scale(1.02); }
        .switch-btn { background: none; border: none; color: #3498db; cursor: pointer; font-family: 'Kanit', sans-serif; font-size: 14px; margin-top: 5px; text-decoration: underline; }
        .error-text { color: #e74c3c; font-size: 13px; font-weight: bold; min-height: 18px; }
        .success-text { color: #2ecc71; font-size: 13px; font-weight: bold; min-height: 18px; }
        
        #loginSection, #registerSection, #controlSection { display: flex; flex-direction: column; gap: 12px; }
        #registerSection, #controlSection { display: none; }

        /* ส่วนหน้าจอจัดการผู้เล่นและส่องจอ */
        .spectator-panel {
            background: #221e3f; padding: 25px; border-radius: 16px; border: 3px solid #3498db;
            box-shadow: 0 0 40px rgba(52, 152, 219, 0.3); width: 100%; max-width: 520px; display: none;
            flex-direction: column; gap: 12px; text-align: left;
        }
        .player-list { max-height: 180px; overflow-y: auto; background: #151328; border: 2px solid #9b59b6; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .player-item { display: flex; justify-content: space-between; align-items: center; background: #221e3f; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
        .player-actions { display: flex; gap: 5px; }
        .btn-kick { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-family: 'Kanit'; font-size: 11px; }
        .btn-reset { background: #f39c12; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-family: 'Kanit'; font-size: 11px; }
        
        #radarCanvas { background: #151328; border: 2px solid #3498db; border-radius: 8px; width: 100%; height: 220px; display: block; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- กล่องระบบล็อกอิน / ตั้งค่า -->
        <div class="admin-box">
            <h2 id="panelTitle">⚙️ ADMIN LOGIN</h2>
            
            <div id="loginSection">
                <div id="loginError" class="error-text"></div>
                <div class="form-group">
                    <label>ชื่อผู้ใช้งาน (admin หรือ Do)</label>
                    <input type="text" id="adminUser" placeholder="admin หรือ Do..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน (Password)</label>
                    <input type="password" id="adminPass" placeholder="รหัสผ่าน..." autocomplete="off">
                </div>
                <button class="action-btn" onclick="adminLogin()">🔑 เข้าสู่ระบบ</button>
                <button class="switch-btn" onclick="showRegister()">ยังไม่มีบัญชี? สมัครสมาชิก Admin</button>
            </div>

            <div id="registerSection">
                <div id="regError" class="error-text"></div>
                <div class="form-group">
                    <label>ตั้งชื่อผู้ใช้งาน (แนะนำ: admin หรือ Do)</label>
                    <input type="text" id="regUser" placeholder="admin หรือ Do..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label>ตั้งรหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
                    <input type="password" id="regPass" placeholder="รหัสผ่านอย่างน้อย 6 ตัว..." autocomplete="off">
                </div>
                <button class="action-btn" style="background: linear-gradient(135deg, #2980b9, #27ae60);" onclick="adminRegister()">📝 สมัครสมาชิก Admin</button>
                <button class="switch-btn" onclick="showLogin()">มีบัญชีอยู่แล้ว? กลับไปเข้าสู่ระบบ</button>
            </div>

            <div id="controlSection">
                <div id="adminMsg" class="success-text"></div>
                <div class="form-group">
                    <label>พลังชีวิตสูงสุดของบอส (Boss Max HP)</label>
                    <input type="number" id="settingBossHp" value="5000">
                </div>
                <div class="form-group">
                    <label>ความเร็วการเดินของบอส (Boss Speed)</label>
                    <input type="number" step="0.1" id="settingBossSpeed" value="1.8">
                </div>
                <div class="form-group">
                    <label>ตัวคูณคะแนนสมการ (Score Multiplier)</label>
                    <input type="number" id="settingScoreMult" value="15">
                </div>
                <div class="form-group">
                    <label>ดาเมจบทลงโทษบอสโจมตี (Boss Penalty)</label>
                    <input type="number" id="settingBossPenalty" value="20">
                </div>
                <button class="action-btn" onclick="saveSettings()">💾 บันทึกและอัปเดตเกมทันที</button>
            </div>
        </div>

        <!-- กล่องส่องจอและจัดการผู้เล่น (แสดงผลเมื่อล็อกอินสำเร็จ) -->
        <div class="spectator-panel" id="spectatorPanel">
            <h2 style="color: #3498db; font-size: 18px;">👀 SPECTATOR & PLAYER CONTROL</h2>
            <div>
                <label>เรดาร์จำลองตำแหน่งผู้เล่นในแมพ (Live Radar)</label>
                <canvas id="radarCanvas" width="460" height="220"></canvas>
            </div>
            <div>
                <label>รายชื่อผู้เล่นที่ออนไลน์ (<span id="playerCount">0</span> คน)</label>
                <div class="player-list" id="playerListContainer">
                    <div style="text-align: center; color: #7f8c8d; font-size: 12px; padding: 20px;">ยังไม่มีผู้เล่นในระบบ</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let livePlayers = {};
        let liveBoss = null;

        function showRegister() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'flex';
            document.getElementById('panelTitle').innerText = '📝 ADMIN REGISTER';
        }

        function showLogin() {
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('panelTitle').innerText = '⚙️ ADMIN LOGIN';
        }

        function adminLogin() {
            let name = document.getElementById('adminUser').value.trim();
            let pass = document.getElementById('adminPass').value.trim();
            if (!name || !pass) { document.getElementById('loginError').innerText = "กรุณากรอกข้อมูลให้ครบถ้วน"; return; }
            socket.emit('adminAuth', { name, pass });
        }

        function adminRegister() {
            let name = document.getElementById('regUser').value.trim();
            let pass = document.getElementById('regPass').value.trim();
            if (!name || !pass) { document.getElementById('regError').innerText = "กรุณากรอกข้อมูลให้ครบถ้วน"; return; }
            socket.emit('adminRegisterAccount', { name, pass });
        }

        socket.on('adminAuthResult', (res) => {
            if (res.success) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('registerSection').style.display = 'none';
                document.getElementById('controlSection').style.display = 'flex';
                document.getElementById('spectatorPanel').style.display = 'flex';
                document.getElementById('panelTitle').innerText = '⚙️ CONFIGURATION';
                if (res.settings) {
                    document.getElementById('settingBossHp').value = res.settings.bossMaxHp;
                    document.getElementById('settingBossSpeed').value = res.settings.bossSpeed;
                    document.getElementById('settingScoreMult').value = res.settings.scoreMultiplier;
                    document.getElementById('settingBossPenalty').value = res.settings.bossPenalty;
                }
            } else {
                document.getElementById('loginError').innerText = res.msg;
                document.getElementById('regError').innerText = res.msg;
            }
        });

        function saveSettings() {
            let hp = document.getElementById('settingBossHp').value;
            let speed = document.getElementById('settingBossSpeed').value;
            let mult = document.getElementById('settingScoreMult').value;
            let penalty = document.getElementById('settingBossPenalty').value;
            socket.emit('updateAdminSettingsFromWeb', { bossMaxHp: hp, bossSpeed: speed, scoreMultiplier: mult, bossPenalty: penalty });
        }

        socket.on('adminUpdateResult', (res) => {
            let msgEl = document.getElementById('adminMsg');
            msgEl.innerText = res.msg;
            msgEl.style.color = res.success ? '#2ecc71' : '#e74c3c';
            setTimeout(() => { msgEl.innerText = ''; }, 3000);
        });

        socket.on('kickedOut', (data) => {
            alert(data.msg);
            window.location.reload();
        });

        // รับข้อมูลตำแหน่งผู้เล่นและบอสแบบเรียลไทม์มาแสดงผลในเรดาร์ Admin
        socket.on('stateUpdate', (data) => {
            livePlayers = data.players || {};
            liveBoss = data.boss || null;
            renderAdminPanel();
        });

        function renderAdminPanel() {
            let container = document.getElementById('playerListContainer');
            let pArray = Object.values(livePlayers);
            document.getElementById('playerCount').innerText = pArray.length;

            if (pArray.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #7f8c8d; font-size: 12px; padding: 20px;">ยังไม่มีผู้เล่นออนไลน์</div>`;
            } else {
                let html = '';
                pArray.forEach(p => {
                    html += `
                        <div class="player-item">
                            <div><b>${p.name || 'Anonymous'}</b> <span style="color:#f39c12; font-size:11px;">[${p.playerClass}]</span> คะแนน: <b>${p.score}</b></div>
                            <div class="player-actions">
                                <button class="btn-reset" onclick="resetScore('${p.socketId}')">รีเซ็ตแต้ม</button>
                                <button class="btn-kick" onclick="kickPlayer('${p.socketId}')">เตะออก</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            // วาดเรดาร์จำลองตำแหน่งใน Map
            const radar = document.getElementById('radarCanvas');
            const rCtx = radar.getContext('2d');
            rCtx.clearRect(0, 0, radar.width, radar.height);

            let mapSize = 4000;
            let scaleX = radar.width / mapSize;
            let scaleY = radar.height / mapSize;

            // วาดขอบเขตแมพ
            rCtx.strokeStyle = '#4a235a';
            rCtx.lineWidth = 2;
            rCtx.strokeRect(0, 0, radar.width, radar.height);

            // วาดบอส
            if (liveBoss) {
                let bx = liveBoss.x * scaleX;
                let by = liveBoss.y * scaleY;
                rCtx.fillStyle = '#e74c3c';
                rCtx.beginPath();
                rCtx.arc(bx, by, 5, 0, Math.PI * 2);
                rCtx.fill();
            }

            // วาดผู้เล่นทุกคน
            pArray.forEach(p => {
                let px = p.x * scaleX;
                let py = p.y * scaleY;
                rCtx.fillStyle = p.outfitColor || '#9b59b6';
                rCtx.beginPath();
                rCtx.arc(px, py, 4, 0, Math.PI * 2);
                rCtx.fill();
                rCtx.strokeStyle = '#ffffff';
                rCtx.lineWidth = 1;
                rCtx.stroke();
            });
        }

        function kickPlayer(socketId) {
            if (confirm("ต้องการเตะผู้เล่นนี้ออกจากเกมใช่หรือไม่?")) {
                socket.emit('adminKickPlayer', socketId);
            }
        }

        function resetScore(socketId) {
            if (confirm("ต้องการรีเซ็ตคะแนนของผู้เล่นนี้เป็น 0 ใช่หรือไม่?")) {
                socket.emit('adminResetScore', socketId);
            }
        }
    </script>
</body>
</html>
