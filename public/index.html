<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math.io - Smooth Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap');
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: #0f0c1b; color: white; overflow: hidden; width: 100vw; height: 100vh; }
        canvas { display: block; background: #151328; width: 100%; height: 100%; }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 8, 20, 0.95); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .box {
            background: #221e3f; padding: 25px; border-radius: 16px; text-align: center;
            border: 3px solid #9b59b6; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px;
        }
        input, select {
            padding: 12px; font-size: 15px; border-radius: 8px; border: 2px solid #9b59b6;
            background: #151328; color: white; text-align: center; font-family: 'Kanit'; outline: none; width: 100%;
        }
        button {
            padding: 12px; font-size: 16px; font-family: 'Kanit'; font-weight: bold; border-radius: 8px;
            border: none; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-play { background: linear-gradient(135deg, #f1c40f, #d35400); color: #2d3436; }
        .btn-host { background: linear-gradient(135deg, #e74c3c, #8e44ad); color: white; }

        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; flex-direction: column; justify-content: space-between; z-index: 50; }
        .hud-top { display: flex; justify-content: space-around; background: rgba(21,19,40,0.9); padding: 10px; border-bottom: 2px solid #f1c40f; pointer-events: auto; }
        .hud-base { text-align: center; font-size: 11px; width: 22%; }
        .hp-bar { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        .hp-fill { height: 100%; width: 100%; transition: width 0.2s; }

        .bottom-panel { background: rgba(21,19,40,0.95); padding: 10px; border-top: 3px solid #9b59b6; pointer-events: auto; display: flex; flex-direction: column; gap: 6px; align-items: center; }
        .eq-box { width: 100%; max-width: 600px; min-height: 45px; background: #151328; border: 2px dashed #9b59b6; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 5px; }
        .inv-box { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; min-height: 35px; }
        .tile { width: 34px; height: 38px; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 6px; cursor: pointer; background: #f1c40f; color: #2d3436; }

        .btn-float { position: absolute; right: 20px; bottom: 130px; width: 75px; height: 75px; border-radius: 50%; background: #e74c3c; border: 2px solid white; color: white; font-weight: bold; font-size: 11px; cursor: pointer; pointer-events: auto; display: flex; justify-content: center; align-items: center; text-align: center; }

        #msgBox { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: bold; text-shadow: 0 0 10px #000; pointer-events: none; opacity: 0; transition: 0.3s; z-index: 90; }
        #msgBox.show { opacity: 1; top: 12%; }
    </style>
</head>
<body>

    <div id="loginModal" class="modal">
        <div class="box">
            <h2 style="color: #f1c40f;">✨ MATH.IO CASTLE RAID</h2>
            <div>
                <label style="font-size:12px; color:#d7bde2;">ชื่อผู้เล่น</label>
                <input type="text" id="nameInput" placeholder="พิมพ์ชื่อของคุณ..." maxlength="15">
            </div>
            <div>
                <label style="font-size:12px; color:#d7bde2;">เลือกทีม</label>
                <select id="teamSelect">
                    <option value="red" id="optRed">🔴 ทีมแดง [0/10]</option>
                    <option value="blue" id="optBlue">🔵 ทีมน้ำเงิน [0/10]</option>
                    <option value="green" id="optGreen">🟢 ทีมเขียว [0/10]</option>
                    <option value="yellow" id="optYellow">🟡 ทีมเหลือง [0/10]</option>
                </select>
            </div>
            <div>
                <label style="font-size:12px; color:#d7bde2;">เลือกอาชีพ</label>
                <select id="classSelect">
                    <option value="Warrior">⚔️ Warrior</option>
                    <option value="Assassin">🗡️ Assassin</option>
                    <option value="Mage">🔮 Mage</option>
                </select>
            </div>
            <div>
                <label style="font-size:12px; color:#d7bde2;">สีตัวละคร</label>
                <input type="color" id="colorInput" value="#9b59b6" style="height: 35px; cursor: pointer;">
            </div>
            <button class="btn-play" onclick="joinGame(false)">▶ เข้าสู่สนามรบ</button>
            <button class="btn-host" onclick="joinGame(true)">👑 เข้าสู่ระบบ Host</button>
        </div>
    </div>

    <div id="msgBox">แจ้งเตือน</div>

    <canvas id="canvas"></canvas>

    <div id="ui">
        <div class="hud-top">
            <div class="hud-base"><span style="color:#e74c3c">🔴 แดง</span><div class="hp-bar"><div id="hpRed" class="hp-fill" style="background:#e74c3c"></div></div><span id="txtRed">3000</span></div>
            <div class="hud-base"><span style="color:#3498db">🔵 น้ำเงิน</span><div class="hp-bar"><div id="hpBlue" class="hp-fill" style="background:#3498db"></div></div><span id="txtBlue">3000</span></div>
            <div class="hud-base"><span style="color:#2ecc71">🟢 เขียว</span><div class="hp-bar"><div id="hpGreen" class="hp-fill" style="background:#2ecc71"></div></div><span id="txtGreen">3000</span></div>
            <div class="hud-base"><span style="color:#f1c40f">🟡 เหลือง</span><div class="hp-bar"><div id="hpYellow" class="hp-fill" style="background:#f1c40f"></div></div><span id="txtYellow">3000</span></div>
        </div>

        <div style="padding: 10px; display: flex; justify-content: space-between; align-items: center;">
            <div style="background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 8px; font-size: 14px;">คะแนน: <span id="scoreDisplay" style="color:#f1c40f; font-weight:bold;">0</span></div>
            <button onclick="window.location.reload()" style="background:#e74c3c; width:80px; padding:6px; font-size:12px;">ออกเกม</button>
        </div>

        <button class="btn-float" onclick="openAttackMenu()">🏰 ถล่ม<br>ปราสาท</button>

        <div class="bottom-panel">
            <div class="eq-box" id="eqZone"></div>
            <div style="display: flex; gap: 8px;">
                <button onclick="clearEq()" style="background:#e67e22; width:100px; padding:6px; font-size:13px;">ล้าง</button>
                <button onclick="sendEq()" style="background:#2ecc71; width:150px; padding:6px; font-size:13px;">ร่ายคาถา!</button>
            </div>
            <div class="inv-box" id="invZone"></div>
        </div>
    </div>

    <div id="attackModal" class="modal" style="display: none;">
        <div class="box" style="max-width: 300px;">
            <h3>🏰 เลือกปราสาทเป้าหมาย</h3>
            <button onclick="attack('red')" style="background:#e74c3c;">🔴 ปราสาทแดง</button>
            <button onclick="attack('blue')" style="background:#3498db;">🔵 ปราสาทน้ำเงิน</button>
            <button onclick="attack('green')" style="background:#2ecc71;">🟢 ปราสาทเขียว</button>
            <button onclick="attack('yellow')" style="background:#f1c40f; color:#333;">🟡 ปราสาทเหลือง</button>
            <button onclick="document.getElementById('attackModal').style.display='none'" style="background:#555;">ยกเลิก</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, MAP_SIZE = 3000;
        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        let myId = null, myTeam = 'red', isHost = false;
        let players = {}, renderPlayers = {}, bases = {}, tiles = [], inventory = [], equation = [];
        const teamColors = { red: '#e74c3c', blue: '#3498db', green: '#2ecc71', yellow: '#f1c40f' };

        socket.on('init', (data) => {
            myId = data.id; MAP_SIZE = data.mapSize; bases = data.bases; tiles = data.tiles;
            updateTeamCounts(data.teamCounts);
        });

        socket.on('teamCounts', (counts) => { updateTeamCounts(counts); });

        function updateTeamCounts(counts) {
            document.getElementById('optRed').innerText = `🔴 ทีมแดง [${counts.red}/10]`;
            document.getElementById('optBlue').innerText = `🔵 ทีมน้ำเงิน [${counts.blue}/10]`;
            document.getElementById('optGreen').innerText = `🟢 ทีมเขียว [${counts.green}/10]`;
            document.getElementById('optYellow').innerText = `🟡 ทีมเหลือง [${counts.yellow}/10]`;
        }

        function joinGame(hostFlag) {
            let name = document.getElementById('nameInput').value.trim();
            if (!name) { alert("กรุณากรอกชื่อผู้เล่นก่อน"); return; }
            myTeam = document.getElementById('teamSelect').value;

            socket.emit('joinGame', {
                name,
                team: myTeam,
                class: document.getElementById('classSelect').value,
                color: document.getElementById('colorInput').value,
                password: hostFlag ? '007007' : ''
            });
        }

        socket.on('joined', (res) => {
            if (res.success) {
                isHost = res.isHost;
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('ui').style.display = 'flex';
                showMsg(isHost ? "👑 โหมด Host พร้อมควบคุมเกม" : "⚔️ เข้าสู่สนามรบสำเร็จ!", "#f1c40f");
            } else {
                alert(res.msg);
            }
        });

        socket.on('msg', (text) => { showMsg(text, "#f1c40f"); });
        socket.on('updateTiles', (newTiles) => { tiles = newTiles; });

        socket.on('state', (data) => {
            players = data.players; bases = data.bases;
            updateBasesHUD();
        });

        socket.on('tileCollected', (tile) => {
            inventory.push(tile);
            renderUI();
        });

        socket.on('eqResult', (res) => {
            if (res.success) {
                showMsg(`🌟 สำเร็จ! +${res.earned} แต้ม`, "#2ecc71");
                document.getElementById('scoreDisplay').innerText = res.score;
                equation = []; renderUI();
            } else {
                showMsg("❌ " + res.msg, "#e74c3c");
            }
        });

        function updateBasesHUD() {
            ['red', 'blue', 'green', 'yellow'].forEach(t => {
                let b = bases[t];
                if (b) {
                    let pct = Math.max(0, (b.hp / b.maxHp) * 100);
                    document.getElementById(`hp${t.charAt(0).toUpperCase() + t.slice(1)}`).style.width = pct + '%';
                    document.getElementById(`txt${t.charAt(0).toUpperCase() + t.slice(1)}`).innerText = b.hp;
                }
            });
        }

        function renderUI() {
            const inv = document.getElementById('invZone'), eq = document.getElementById('eqZone');
            inv.innerHTML = ''; eq.innerHTML = '';
            inventory.forEach((t, i) => {
                let el = document.createElement('div'); el.className = 'tile'; el.innerText = t.char;
                el.onclick = () => { equation.push(inventory.splice(i, 1)[0]); renderUI(); };
                inv.appendChild(el);
            });
            equation.forEach((t, i) => {
                let el = document.createElement('div'); el.className = 'tile'; el.innerText = t.char;
                el.onclick = () => { inventory.push(equation.splice(i, 1)[0]); renderUI(); };
                eq.appendChild(el);
            });
        }

        function clearEq() { inventory = inventory.concat(equation); equation = []; renderUI(); }
        function sendEq() { if (equation.length > 0) socket.emit('submitEquation', equation.map(t => t.char).join('')); }
        function openAttackMenu() { document.getElementById('attackModal').style.display = 'flex'; }
        function attack(team) { document.getElementById('attackModal').style.display = 'none'; socket.emit('attackBase', team); }

        function showMsg(text, color) {
            let m = document.getElementById('msgBox');
            m.innerText = text; m.style.color = color; m.classList.add('show');
            setTimeout(() => m.classList.remove('show'), 2500);
        }

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => setKey(e.key, true));
        window.addEventListener('keyup', e => setKey(e.key, false));
        function setKey(k, state) {
            k = k.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = state;
            if (k === 's' || k === 'arrowdown') keys.s = state;
            if (k === 'a' || k === 'arrowleft') keys.a = state;
            if (k === 'd' || k === 'arrowright') keys.d = state;
        }

        function gameLoop() {
            if (myId && players[myId] && players[myId].joined && !isHost) {
                let p = players[myId];
                let speed = 5, dx = 0, dy = 0;
                if (keys.w) dy -= speed; if (keys.s) dy += speed;
                if (keys.a) dx -= speed; if (keys.d) dx += speed;
                if (dx !== 0 || dy !== 0) {
                    socket.emit('move', { x: p.x + dx, y: p.y + dy });
                }
            }

            // ระบบ Interpolation (Lerp) เกลี่ยตำแหน่งผู้เล่นให้ลื่นไหล
            for (let id in players) {
                let serverPl = players[id];
                if (!renderPlayers[id]) {
                    renderPlayers[id] = { ...serverPl };
                } else {
                    renderPlayers[id].x += (serverPl.x - renderPlayers[id].x) * 0.3;
                    renderPlayers[id].y += (serverPl.y - renderPlayers[id].y) * 0.3;
                    renderPlayers[id].name = serverPl.name;
                    renderPlayers[id].team = serverPl.team;
                    renderPlayers[id].color = serverPl.color;
                    renderPlayers[id].joined = serverPl.joined;
                    renderPlayers[id].isHost = serverPl.isHost;
                }
            }
            for (let id in renderPlayers) {
                if (!players[id]) delete renderPlayers[id];
            }

            ctx.fillStyle = '#151328'; ctx.fillRect(0, 0, width, height);

            if (renderPlayers[myId]) {
                let me = renderPlayers[myId];
                let camX = me.x - width / 2, camY = me.y - height / 2;

                ctx.save(); ctx.translate(-camX, -camY);

                ctx.strokeStyle = '#4a235a'; ctx.lineWidth = 20; ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

                for (let k in bases) {
                    let b = bases[k];
                    ctx.fillStyle = teamColors[k] + '66';
                    ctx.strokeStyle = teamColors[k];
                    ctx.lineWidth = 4;
                    ctx.fillRect(b.x - 60, b.y - 60, 120, 120);
                    ctx.strokeRect(b.x - 60, b.y - 60, 120, 120);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Kanit'; ctx.textAlign = 'center';
                    ctx.fillText(`🏰 ${b.name}`, b.x, b.y - 75);
                    ctx.fillText(`HP: ${b.hp}`, b.x, b.y + 80);
                }

                tiles.forEach(t => {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#2d3436'; ctx.font = 'bold 16px Kanit'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(t.char, t.x, t.y);
                });

                for (let id in renderPlayers) {
                    let pl = renderPlayers[id];
                    if (!pl.joined || pl.isHost) continue;
                    ctx.fillStyle = teamColors[pl.team] || '#fff';
                    ctx.beginPath(); ctx.arc(pl.x, pl.y, 14, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = pl.color || '#9b59b6';
                    ctx.fillRect(pl.x - 10, pl.y - 25, 20, 12);
                    ctx.fillStyle = '#fff'; ctx.font = '12px Kanit'; ctx.textAlign = 'center';
                    ctx.fillText(pl.name, pl.x, pl.y - 35);
                }

                ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
