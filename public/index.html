<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math.io - RPG Math Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap');
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: #1e272e; color: white; overflow: hidden; width: 100vw; height: 100vh; }
        canvas { display: block; background: #2f3640; width: 100%; height: 100%; }
        
        #nameModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box {
            background: #2f3640; padding: 25px; border-radius: 12px; text-align: center;
            display: flex; flex-direction: column; gap: 12px; border: 3px solid #00cec9; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90%; max-width: 400px;
        }
        .modal-box h2 { color: #ffeaa7; }
        .modal-box input, .modal-box select {
            padding: 10px; font-size: 16px; border-radius: 8px; border: 2px solid #636e72; text-align: center;
            font-family: 'Kanit', sans-serif; background: #1e272e; color: white; outline: none; width: 100%;
        }
        .modal-box label { font-size: 14px; color: #b2bec3; text-align: left; }
        .modal-box button {
            padding: 12px; font-size: 18px; font-family: 'Kanit', sans-serif; font-weight: bold;
            background: #00b894; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px;
        }

        /* กล่องปริศนา Modal */
        #mysteryModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 150;
        }
        .mystery-box {
            background: #2f3640; padding: 30px; border-radius: 15px; text-align: center;
            border: 4px solid #f1c40f; box-shadow: 0 0 30px rgba(241, 196, 15, 0.5); width: 90%; max-width: 350px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .mystery-box h2 { color: #f1c40f; }
        .mystery-box input {
            padding: 12px; font-size: 22px; border-radius: 8px; border: 2px solid #f1c40f; text-align: center;
            font-family: 'Kanit', sans-serif; background: #1e272e; color: white; outline: none;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }
        .header { padding: 15px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; }
        .leaderboard { background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; font-size: 14px; min-width: 160px; pointer-events: auto; }
        
        .bottom-panel {
            background: rgba(47, 54, 64, 0.95); padding: 10px 15px; border-top: 4px solid #00cec9;
            pointer-events: auto; display: flex; flex-direction: column; gap: 8px; align-items: center;
        }
        .equation-area { background: #1e272e; width: 100%; max-width: 600px; min-height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 5px; border: 2px dashed #00cec9; padding: 5px; }
        .inventory-area { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; min-height: 40px; width: 100%; }

        .tile {
            width: 36px; height: 40px; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center;
            border-radius: 6px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }
        .tile.num { background: #ffeaa7; color: #2d3436; }
        .tile.op { background: #ff7675; color: white; }
        .tile.eq { background: #74b9ff; color: white; }

        .controls { display: flex; gap: 10px; }
        button.action-btn { padding: 6px 20px; font-size: 15px; font-family: 'Kanit', sans-serif; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-submit { background: #00b894; color: white; }
        .btn-clear { background: #fab1a0; color: #2d3436; }
        
        .sys-msg { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.8); opacity: 0; transition: 0.3s; pointer-events: none; }
        .sys-msg.show { opacity: 1; top: 10%; }

        #mobileDpad {
            position: absolute; bottom: 150px; left: 20px; width: 130px; height: 130px;
            pointer-events: auto; display: none; z-index: 50;
        }
        .d-btn {
            position: absolute; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; color: white;
        }
        .d-btn:active { background: rgba(0,206,201,0.6); }
        #btnUp { top: 0; left: 42px; }
        #btnDown { bottom: 0; left: 42px; }
        #btnLeft { top: 42px; left: 0; }
        #btnRight { top: 42px; right: 0; }

        @media (pointer: coarse) { #mobileDpad { display: block; } }
    </style>
</head>
<body>

    <!-- หน้าต่างสร้างตัวละครและแต่งตัว -->
    <div id="nameModal">
        <div class="modal-box">
            <h2>🛡️ สร้างตัวละคร</h2>
            <div>
                <label>ชื่อตัวละคร</label>
                <input type="text" id="playerNameInput" placeholder="กรอกชื่อ..." maxlength="15" autocomplete="off">
            </div>
            <div>
                <label>เลือกคลาสตัวละคร</label>
                <select id="playerAvatar">
                    <option value="hero">🦸‍♂️ นักรบผู้กล้า</option>
                    <option value="wizard">🧙‍♂️ นักเวทย์ฝึกหัด</option>
                    <option value="robot">🤖 หุ่นยนต์จักรกล</option>
                </select>
            </div>
            <div>
                <label>สีชุดเสื้อผ้า</label>
                <input type="color" id="playerColor" value="#3498db" style="height: 40px; cursor: pointer;">
            </div>
            <div>
                <label>หมวก / เครื่องประดับ</label>
                <select id="playerHat">
                    <option value="none">ไม่มีหมวก</option>
                    <option value="crown">👑 มงกุฎราชา</option>
                    <option value="wizard_hat">🎩 หมวกพ่อมด</option>
                    <option value="cap">🧢 หมวกแก๊ป</option>
                </select>
            </div>
            <button onclick="joinGame()">เข้าสู่สนามรบ</button>
        </div>
    </div>

    <!-- หน้าต่างแก้โจทย์กล่องปริศนา -->
    <div id="mysteryModal">
        <div class="mystery-box">
            <h2>🎁 กล่องปริศนาคณิตศาสตร์!</h2>
            <p style="font-size: 16px; color: #b2bec3;">แก้โจทย์นี้เพื่อรับ +50 คะแนน</p>
            <div id="mysteryQuestion" style="font-size: 28px; font-weight: bold; color: #ffeaa7;">12 + 5 = ?</div>
            <input type="number" id="mysteryInput" placeholder="คำตอบ...">
            <button onclick="submitMystery()" style="background: #f1c40f; color: #2d3436;">ยืนยันคำตอบ</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobileDpad">
        <div class="d-btn" id="btnUp">▲</div>
        <div class="d-btn" id="btnLeft">◀</div>
        <div class="d-btn" id="btnRight">▶</div>
        <div class="d-btn" id="btnDown">▼</div>
    </div>

    <div id="ui-layer">
        <div class="header">
            <div style="color: #00cec9;">คะแนน: <span id="scoreDisplay">0</span></div>
            <div class="leaderboard">
                <h3 style="color: #ffeaa7; margin-bottom: 3px;">🏆 อันดับ</h3>
                <ol id="leaderboardList" style="padding-left: 15px;"></ol>
            </div>
        </div>

        <div class="sys-msg" id="sysMsg">แจ้งเตือน</div>

        <div class="bottom-panel">
            <div class="equation-area" id="equationZone"></div>
            <div class="controls">
                <button class="action-btn btn-clear" onclick="returnTiles()">ล้างสมการ</button>
                <button class="action-btn btn-submit" onclick="sendEquation()">ส่งตรวจ!</button>
            </div>
            <div class="inventory-area" id="inventoryZone"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        let myId = null;
        let players = {};
        let renderPlayers = {};
        let tiles = [];
        let mysteryBoxes = [];
        let inventory = [];
        let equation = [];
        let myScore = 0;
        let gameStarted = false;
        let currentMysteryAns = null;

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => { if(gameStarted) setKey(e.key, true); });
        window.addEventListener('keyup', e => { if(gameStarted) setKey(e.key, false); });
        function setKey(k, state) {
            k = k.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = state;
            if (k === 's' || k === 'arrowdown') keys.s = state;
            if (k === 'a' || k === 'arrowleft') keys.a = state;
            if (k === 'd' || k === 'arrowright') keys.d = state;
        }

        function setupTouchButton(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => keys[keyName] = true);
            btn.addEventListener('mouseup', () => keys[keyName] = false);
            btn.addEventListener('mouseleave', () => keys[keyName] = false);
        }
        setupTouchButton('btnUp', 'w');
        setupTouchButton('btnDown', 's');
        setupTouchButton('btnLeft', 'a');
        setupTouchButton('btnRight', 'd');

        function joinGame() {
            const name = document.getElementById('playerNameInput').value.trim() || 'นักรบฝึกหัด';
            const avatar = document.getElementById('playerAvatar').value;
            const outfitColor = document.getElementById('playerColor').value;
            const hat = document.getElementById('playerHat').value;

            socket.emit('setupPlayer', { name, avatar, outfitColor, hat });
            document.getElementById('nameModal').style.display = 'none';
            gameStarted = true;
        }

        socket.on('initGame', (data) => {
            myId = data.id;
            tiles = data.tiles;
            mysteryBoxes = data.mysteryBoxes;
        });

        socket.on('stateUpdate', (serverPlayers) => {
            players = serverPlayers;
            if(players[myId]) {
                myScore = players[myId].score;
                document.getElementById('scoreDisplay').innerText = myScore;
            }
        });

        socket.on('tileCollected', (tile) => {
            inventory.push(tile);
            renderUI();
        });

        socket.on('tileRemoved', (id) => { tiles = tiles.filter(t => t.id !== id); });
        socket.on('newTile', (tile) => { tiles.push(tile); });

        socket.on('mysteryBoxRemoved', (id) => { mysteryBoxes = mysteryBoxes.filter(b => b.id !== id); });
        socket.on('newMysteryBox', (box) => { mysteryBoxes.push(box); });

        socket.on('openMysteryBox', (data) => {
            currentMysteryAns = data.ans;
            document.getElementById('mysteryQuestion').innerText = data.q;
            document.getElementById('mysteryInput').value = '';
            document.getElementById('mysteryModal').style.display = 'flex';
            document.getElementById('mysteryInput').focus();
        });

        function submitMystery() {
            let userAns = document.getElementById('mysteryInput').value;
            if (userAns !== '') {
                socket.emit('submitMysteryAnswer', { userAns, correctAns: currentMysteryAns });
                document.getElementById('mysteryModal').style.display = 'none';
            }
        }

        socket.on('mysteryResult', (res) => {
            if (res.success) {
                showMsg("🎁 ถูกต้อง! รับไปเลย +50 แต้ม", "#f1c40f");
            } else {
                showMsg("❌ ตอบผิด กล่องปริศนาระเบิด!", "#ff7675");
            }
        });

        socket.on('equationResult', (res) => {
            if (res.success) {
                showMsg("🎉 สมการถูกต้อง! ได้รับแต้มเพิ่ม", "#00b894");
                equation = [];
                renderUI();
            } else {
                showMsg("❌ " + res.msg, "#ff7675");
            }
        });

        socket.on('updateLeaderboard', (allPlayers) => {
            let list = Object.values(allPlayers).sort((a,b) => b.score - a.score);
            let html = '';
            list.slice(0, 5).forEach((p, i) => {
                html += `<li>${i+1}. ${p.name} (${p.score})</li>`;
            });
            document.getElementById('leaderboardList').innerHTML = html;
        });

        function renderUI() {
            const invZone = document.getElementById('inventoryZone');
            const eqZone = document.getElementById('equationZone');
            invZone.innerHTML = ''; eqZone.innerHTML = '';

            inventory.forEach((tile, index) => {
                let el = document.createElement('div');
                el.className = `tile ${tile.type}`;
                el.innerText = tile.char;
                el.onclick = () => { equation.push(inventory.splice(index, 1)[0]); renderUI(); };
                invZone.appendChild(el);
            });

            equation.forEach((tile, index) => {
                let el = document.createElement('div');
                el.className = `tile ${tile.type}`;
                el.innerText = tile.char;
                el.onclick = () => { inventory.push(equation.splice(index, 1)[0]); renderUI(); };
                eqZone.appendChild(el);
            });
        }

        function returnTiles() {
            inventory = inventory.concat(equation);
            equation = [];
            renderUI();
        }

        function sendEquation() {
            if (equation.length === 0) return;
            socket.emit('submitEquation', equation.map(t => t.char).join(''));
        }

        function showMsg(text, color) {
            const msg = document.getElementById('sysMsg');
            msg.innerText = text;
            msg.style.color = color;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2500);
        }

        // ฟังก์ชันวาดตัวละครคนเดิน
        function drawHumanAvatar(ctx, x, y, pl, isMoving) {
            ctx.save();
            ctx.translate(x, y);

            let walkAnim = isMoving ? Math.sin(Date.now() / 80) * 4 : 0;

            // ตัวเสื้อผ้า
            ctx.fillStyle = pl.outfitColor || '#3498db';
            ctx.beginPath();
            ctx.roundRect(-12, -10 + walkAnim/2, 24, 26, 6);
            ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#2d3436'; ctx.stroke();

            // ขาซ้าย/ขวา
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(-8, 14, 5, 10 - walkAnim);
            ctx.fillRect(3, 14, 5, 10 + walkAnim);

            // หัวตัวละคร
            ctx.fillStyle = '#ffeaa7';
            ctx.beginPath();
            ctx.arc(0, -18 + walkAnim/2, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // ตาและหน้าตาตามคลาส
            ctx.fillStyle = '#2d3436';
            ctx.fillRect(-4, -20 + walkAnim/2, 3, 3);
            ctx.fillRect(2, -20 + walkAnim/2, 3, 3);

            if (pl.avatar === 'wizard') {
                ctx.fillStyle = '#9b59b6';
                ctx.fillRect(-6, -24 + walkAnim/2, 12, 3);
            } else if (pl.avatar === 'robot') {
                ctx.fillStyle = '#00cec9';
                ctx.fillRect(-2, -26 + walkAnim/2, 4, 5); // เสาอากาศ
            }

            // หมวก / เครื่องประดับ
            if (pl.hat === 'crown') {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.moveTo(-10, -28); ctx.lineTo(-10, -35); ctx.lineTo(-5, -31); ctx.lineTo(0, -36); ctx.lineTo(5, -31); ctx.lineTo(10, -35); ctx.lineTo(10, -28);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (pl.hat === 'wizard_hat') {
                ctx.fillStyle = '#8e44ad';
                ctx.beginPath();
                ctx.moveTo(-14, -26); ctx.lineTo(14, -26); ctx.lineTo(0, -42);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (pl.hat === 'cap') {
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(0, -24, 11, Math.PI, 0, false);
                ctx.fill(); ctx.stroke();
            }

            ctx.restore();
        }

        function gameLoop() {
            if (gameStarted && myId && players[myId]) {
                let p = players[myId];
                let dx = 0, dy = 0, speed = 4.5;
                if (keys.w) dy -= speed;
                if (keys.s) dy += speed;
                if (keys.a) dx -= speed;
                if (keys.d) dx += speed;

                let isMoving = (dx !== 0 || dy !== 0);
                if (isMoving) {
                    socket.emit('move', { x: p.x + dx, y: p.y + dy, isMoving: true });
                } else {
                    socket.emit('move', { x: p.x, y: p.y, isMoving: false });
                }

                // Smooth Interpolation
                for (let id in players) {
                    if (!renderPlayers[id]) {
                        renderPlayers[id] = { x: players[id].x, y: players[id].y, name: players[id].name, avatar: players[id].avatar, outfitColor: players[id].outfitColor, hat: players[id].hat, isMoving: false };
                    }
                    renderPlayers[id].x += (players[id].x - renderPlayers[id].x) * 0.25;
                    renderPlayers[id].y += (players[id].y - renderPlayers[id].y) * 0.25;
                    renderPlayers[id].name = players[id].name;
                    renderPlayers[id].avatar = players[id].avatar;
                    renderPlayers[id].outfitColor = players[id].outfitColor;
                    renderPlayers[id].hat = players[id].hat;
                    renderPlayers[id].isMoving = players[id].isMoving;
                }
                for (let id in renderPlayers) {
                    if (!players[id]) delete renderPlayers[id];
                }

                let me = renderPlayers[myId] || p;
                let camX = me.x - (width / 2);
                let camY = me.y - (height / 2);

                ctx.clearRect(0, 0, width, height);
                ctx.save();
                ctx.translate(-camX, -camY);

                // ขอบเขตแผนที่
                ctx.strokeStyle = '#636e72'; ctx.lineWidth = 6;
                ctx.strokeRect(0, 0, 1500, 1500);

                // วาดเบี้ยบนพื้น
                ctx.font = '18px Kanit'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                tiles.forEach(t => {
                    ctx.fillStyle = t.type === 'num' ? '#ffeaa7' : (t.type === 'op' ? '#ff7675' : '#74b9ff');
                    ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#2d3436'; ctx.fillText(t.char, t.x, t.y);
                });

                // วาดกล่องปริศนา
                mysteryBoxes.forEach(b => {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(b.x - 16, b.y - 16, 32, 32);
                    ctx.lineWidth = 2; ctx.strokeStyle = '#d35400'; ctx.strokeRect(b.x - 16, b.y - 16, 32, 32);
                    ctx.fillStyle = '#2d3436'; ctx.font = 'bold 20px Kanit'; ctx.fillText('?', b.x, b.y);
                });

                // วาดตัวละครผู้เล่นทุกคน
                for (let id in renderPlayers) {
                    let pl = renderPlayers[id];
                    drawHumanAvatar(ctx, pl.x, pl.y, pl, pl.isMoving);

                    // ป้ายชื่อ
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 14px Kanit';
                    ctx.textAlign = 'center';
                    ctx.fillText(pl.name, pl.x, pl.y - 45);
                }

                ctx.restore();
            }
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
