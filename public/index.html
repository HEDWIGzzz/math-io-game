<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math.io - Magical Castle Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap');
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: #0f0c1b; color: white; overflow: hidden; width: 100vw; height: 100vh; }
        canvas { display: block; background: #151328; width: 100%; height: 100%; }
        
        #nameModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 8, 20, 0.9); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box {
            background: #221e3f; padding: 30px; border-radius: 15px; text-align: center;
            display: flex; flex-direction: column; gap: 14px; border: 3px solid #9b59b6; box-shadow: 0 0 40px rgba(155, 89, 182, 0.4);
            width: 90%; max-width: 400px;
        }
        .modal-box h2 { color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .modal-box input, .modal-box select {
            padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #9b59b6; text-align: center;
            font-family: 'Kanit', sans-serif; background: #151328; color: white; outline: none; width: 100%;
        }
        .modal-box label { font-size: 14px; color: #d7bde2; text-align: left; }
        .modal-box button {
            padding: 12px; font-size: 18px; font-family: 'Kanit', sans-serif; font-weight: bold;
            background: linear-gradient(135deg, #8e44ad, #3498db); color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }

        #mysteryModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 150;
        }
        .mystery-box {
            background: #221e3f; padding: 30px; border-radius: 15px; text-align: center;
            border: 4px solid #f39c12; box-shadow: 0 0 35px rgba(243, 156, 18, 0.6); width: 90%; max-width: 350px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .mystery-box h2 { color: #f39c12; }
        .mystery-box input {
            padding: 12px; font-size: 24px; border-radius: 8px; border: 2px solid #f39c12; text-align: center;
            font-family: 'Kanit', sans-serif; background: #151328; color: white; outline: none;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }
        .header { padding: 15px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; }
        .leaderboard { background: rgba(21, 19, 40, 0.85); border: 2px solid #9b59b6; padding: 10px 15px; border-radius: 10px; font-size: 14px; min-width: 180px; pointer-events: auto; }
        
        .bottom-panel {
            background: rgba(21, 19, 40, 0.95); padding: 12px 15px; border-top: 4px solid #9b59b6;
            pointer-events: auto; display: flex; flex-direction: column; gap: 8px; align-items: center;
        }
        .equation-area { background: #151328; width: 100%; max-width: 650px; min-height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 5px; border: 2px dashed #9b59b6; padding: 5px; }
        .inventory-area { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; min-height: 40px; width: 100%; }

        .tile {
            width: 36px; height: 40px; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center;
            border-radius: 6px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.4);
        }
        .tile.num { background: #f1c40f; color: #2d3436; }
        .tile.op { background: #e74c3c; color: white; }
        .tile.eq { background: #3498db; color: white; }

        .controls { display: flex; gap: 10px; }
        button.action-btn { padding: 6px 20px; font-size: 15px; font-family: 'Kanit', sans-serif; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-submit { background: #2ecc71; color: white; }
        .btn-clear { background: #e67e22; color: white; }
        
        .sys-msg { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; text-shadow: 0 2px 8px rgba(0,0,0,0.9); opacity: 0; transition: 0.3s; pointer-events: none; }
        .sys-msg.show { opacity: 1; top: 10%; }

        #mobileDpad {
            position: absolute; bottom: 160px; left: 20px; width: 130px; height: 130px;
            pointer-events: auto; display: none; z-index: 50;
        }
        .d-btn {
            position: absolute; background: rgba(155, 89, 182, 0.3); border: 2px solid rgba(155, 89, 182, 0.7);
            border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; color: white;
        }
        .d-btn:active { background: rgba(155, 89, 182, 0.8); }
        #btnUp { top: 0; left: 42px; }
        #btnDown { bottom: 0; left: 42px; }
        #btnLeft { top: 42px; left: 0; }
        #btnRight { top: 42px; right: 0; }

        @media (pointer: coarse) { #mobileDpad { display: block; } }
    </style>
</head>
<body>

    <!-- หน้าต่างสร้างตัวละคร -->
    <div id="nameModal">
        <div class="modal-box">
            <h2>🏰 ห้องโถงปราสาทเวทมนตร์</h2>
            <div>
                <label>ฉายาจอมเวทย์</label>
                <input type="text" id="playerNameInput" placeholder="ชื่อจอมเวทย์ของคุณ..." maxlength="15" autocomplete="off">
            </div>
            <div>
                <label>สายเวทมนตร์</label>
                <select id="playerAvatar">
                    <option value="hero">⚔️ อัศวินผู้พิทักษ์</option>
                    <option value="wizard">🧙‍♂️ จอมเวทย์โบราณ</option>
                    <option value="robot">🔮 โกลมเวทมนตร์</option>
                </select>
            </div>
            <div>
                <label>สีเสื้อคลุมเวท</label>
                <input type="color" id="playerColor" value="#9b59b6" style="height: 40px; cursor: pointer;">
            </div>
            <div>
                <label>หมวกเวทมนตร์</label>
                <select id="playerHat">
                    <option value="none">ไม่มีหมวก</option>
                    <option value="crown">👑 มงกุฎแห่งราชา</option>
                    <option value="wizard_hat">🎩 หมวกพ่อมดมนตรา</option>
                    <option value="cap">🪖 หมวกเกราะอัศวิน</option>
                </select>
            </div>
            <button onclick="joinGame()">เข้าสู่ปราสาท (รองรับ 80 คน)</button>
        </div>
    </div>

    <!-- หน้าต่างกล่องปริศนาเวทมนตร์ -->
    <div id="mysteryModal">
        <div class="mystery-box">
            <h2>✨ กล่องสมบัติเวทมนตร์!</h2>
            <p style="font-size: 15px; color: #d7bde2;">แก้รูนคาถานี้เพื่อรับ +60 คะแนนโบนัส</p>
            <div id="mysteryQuestion" style="font-size: 28px; font-weight: bold; color: #f1c40f;">15 + 8 = ?</div>
            <input type="number" id="mysteryInput" placeholder="ผลลัพธ์...">
            <button onclick="submitMystery()" style="background: #f1c40f; color: #2d3436; font-weight: bold; padding: 10px; border-radius: 8px; border:none; cursor:pointer;">ปลดผนึกเวท!</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobileDpad">
        <div class="d-btn" id="btnUp">▲</div>
        <div class="d-btn" id="btnLeft">◀</div>
        <div class="d-btn" id="btnRight">▶</div>
        <div class="d-btn" id="btnDown">▼</div>
    </div>

    <div id="ui-layer">
        <div class="header">
            <div style="color: #f1c40f; text-shadow: 0 0 10px rgba(241,196,15,0.5);">คะแนน: <span id="scoreDisplay">0</span></div>
            <div class="leaderboard">
                <h3 style="color: #f1c40f; margin-bottom: 3px; text-align: center;">🏆 ทำเนียบคณาจารย์ (80 คน)</h3>
                <ol id="leaderboardList" style="padding-left: 15px;"></ol>
            </div>
        </div>

        <div class="sys-msg" id="sysMsg">แจ้งเตือน</div>

        <div class="bottom-panel">
            <div class="equation-area" id="equationZone"></div>
            <div class="controls">
                <button class="action-btn btn-clear" onclick="returnTiles()">ล้างคาถา</button>
                <button class="action-btn btn-submit" onclick="sendEquation()">ร่ายคาถาสมการ!</button>
            </div>
            <div class="inventory-area" id="inventoryZone"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let MAP_SIZE = 4000;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        let myId = null;
        let players = {};
        let renderPlayers = {};
        let tiles = [];
        let mysteryBoxes = [];
        let inventory = [];
        let equation = [];
        let myScore = 0;
        let gameStarted = false;
        let currentMysteryAns = null;

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => { if(gameStarted) setKey(e.key, true); });
        window.addEventListener('keyup', e => { if(gameStarted) setKey(e.key, false); });
        function setKey(k, state) {
            k = k.toLowerCase();
            if (k === 'w' || k === 'arrowup') keys.w = state;
            if (k === 's' || k === 'arrowdown') keys.s = state;
            if (k === 'a' || k === 'arrowleft') keys.a = state;
            if (k === 'd' || k === 'arrowright') keys.d = state;
        }

        function setupTouchButton(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => keys[keyName] = true);
            btn.addEventListener('mouseup', () => keys[keyName] = false);
            btn.addEventListener('mouseleave', () => keys[keyName] = false);
        }
        setupTouchButton('btnUp', 'w');
        setupTouchButton('btnDown', 's');
        setupTouchButton('btnLeft', 'a');
        setupTouchButton('btnRight', 'd');

        function joinGame() {
            const name = document.getElementById('playerNameInput').value.trim() || 'จอมเวทย์ฝึกหัด';
            const avatar = document.getElementById('playerAvatar').value;
            const outfitColor = document.getElementById('playerColor').value;
            const hat = document.getElementById('playerHat').value;

            socket.emit('setupPlayer', { name, avatar, outfitColor, hat });
            document.getElementById('nameModal').style.display = 'none';
            gameStarted = true;
        }

        socket.on('initGame', (data) => {
            myId = data.id;
            tiles = data.tiles;
            mysteryBoxes = data.mysteryBoxes;
            MAP_SIZE = data.mapSize;
        });

        socket.on('stateUpdate', (serverPlayers) => {
            players = serverPlayers;
            if(players[myId]) {
                myScore = players[myId].score;
                document.getElementById('scoreDisplay').innerText = myScore;
            }
        });

        socket.on('tileCollected', (tile) => {
            inventory.push(tile);
            renderUI();
        });

        socket.on('tileRemoved', (id) => { tiles = tiles.filter(t => t.id !== id); });
        socket.on('newTile', (tile) => { tiles.push(tile); });

        socket.on('mysteryBoxRemoved', (id) => { mysteryBoxes = mysteryBoxes.filter(b => b.id !== id); });
        socket.on('newMysteryBox', (box) => { mysteryBoxes.push(box); });

        socket.on('openMysteryBox', (data) => {
            currentMysteryAns = data.ans;
            document.getElementById('mysteryQuestion').innerText = data.q;
            document.getElementById('mysteryInput').value = '';
            document.getElementById('mysteryModal').style.display = 'flex';
            document.getElementById('mysteryInput').focus();
        });

        function submitMystery() {
            let userAns = document.getElementById('mysteryInput').value;
            if (userAns !== '') {
                socket.emit('submitMysteryAnswer', { userAns, correctAns: currentMysteryAns });
                document.getElementById('mysteryModal').style.display = 'none';
            }
        }

        socket.on('mysteryResult', (res) => {
            if (res.success) {
                showMsg("✨ ปลดผนึกสำเร็จ! ได้รับ +60 คะแนน", "#f1c40f");
            } else {
                showMsg("❌ คาถาผิดพลาด! พลังเวทย์สะท้อนกลับ", "#e74c3c");
            }
        });

        socket.on('equationResult', (res) => {
            if (res.success) {
                showMsg("🌟 ร่ายคาถาสมการสำเร็จ!", "#2ecc71");
                equation = [];
                renderUI();
            } else {
                showMsg("❌ " + res.msg, "#e74c3c");
            }
        });

        socket.on('updateLeaderboard', (allPlayers) => {
            let list = Object.values(allPlayers).sort((a,b) => b.score - a.score);
            let html = '';
            list.slice(0, 5).forEach((p, i) => {
                html += `<li>${i+1}. ${p.name} (${p.score})</li>`;
            });
            document.getElementById('leaderboardList').innerHTML = html;
        });

        function renderUI() {
            const invZone = document.getElementById('inventoryZone');
            const eqZone = document.getElementById('equationZone');
            invZone.innerHTML = ''; eqZone.innerHTML = '';

            inventory.forEach((tile, index) => {
                let el = document.createElement('div');
                el.className = `tile ${tile.type}`;
                el.innerText = tile.char;
                el.onclick = () => { equation.push(inventory.splice(index, 1)[0]); renderUI(); };
                invZone.appendChild(el);
            });

            equation.forEach((tile, index) => {
                let el = document.createElement('div');
                el.className = `tile ${tile.type}`;
                el.innerText = tile.char;
                el.onclick = () => { inventory.push(equation.splice(index, 1)[0]); renderUI(); };
                eqZone.appendChild(el);
            });
        }

        function returnTiles() {
            inventory = inventory.concat(equation);
            equation = [];
            renderUI();
        }

        function sendEquation() {
            if (equation.length === 0) return;
            socket.emit('submitEquation', equation.map(t => t.char).join(''));
        }

        function showMsg(text, color) {
            const msg = document.getElementById('sysMsg');
            msg.innerText = text;
            msg.style.color = color;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2500);
        }

        // วาดตัวละครปราสาทเวทมนตร์
        function drawCastleAvatar(ctx, x, y, pl, isMoving) {
            ctx.save();
            ctx.translate(x, y);

            let walkAnim = isMoving ? Math.sin(Date.now() / 70) * 5 : 0;

            // เสื้อคลุมจอมเวทย์
            ctx.fillStyle = pl.outfitColor || '#9b59b6';
            ctx.beginPath();
            ctx.roundRect(-14, -10 + walkAnim/2, 28, 28, 8);
            ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#2c3e50'; ctx.stroke();

            // ขา
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(-9, 16, 6, 10 - walkAnim);
            ctx.fillRect(3, 16, 6, 10 + walkAnim);

            // หัว
            ctx.fillStyle = '#f5b041';
            ctx.beginPath();
            ctx.arc(0, -18 + walkAnim/2, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // ดวงตาเรืองแสง
            ctx.fillStyle = '#3498db';
            ctx.fillRect(-5, -21 + walkAnim/2, 3, 3);
            ctx.fillRect(2, -21 + walkAnim/2, 3, 3);

            // หมวก / เครื่องประดับ
            if (pl.hat === 'crown') {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.moveTo(-11, -30); ctx.lineTo(-11, -38); ctx.lineTo(-5, -33); ctx.lineTo(0, -40); ctx.lineTo(5, -33); ctx.lineTo(11, -38); ctx.lineTo(11, -30);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (pl.hat === 'wizard_hat') {
                ctx.fillStyle = '#8e44ad';
                ctx.beginPath();
                ctx.moveTo(-16, -28); ctx.lineTo(16, -28); ctx.lineTo(0, -46);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (pl.hat === 'cap') {
                ctx.fillStyle = '#34495e';
                ctx.beginPath();
                ctx.arc(0, -25, 12, Math.PI, 0, false);
                ctx.fill(); ctx.stroke();
            }

            ctx.restore();
        }

        // วาดฉากหลังพื้นปราสาทเวทมนตร์และลวดลายหิน
        function drawCastleBackground(camX, camY) {
            ctx.fillStyle = '#151328';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(-camX, -camY);

            // ขอบเขตกำแพงปราสาทหนาพิเศษ
            ctx.strokeStyle = '#4a235a';
            ctx.lineWidth = 20;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            // วาดลายตารางพื้นหินปราสาท
            ctx.strokeStyle = 'rgba(155, 89, 182, 0.08)';
            ctx.lineWidth = 2;
            let gridSize = 100;
            for (let x = 0; x <= MAP_SIZE; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= MAP_SIZE; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }

            // วาดสัญลักษณ์วงเวทมนตร์กลางปราสาท
            ctx.strokeStyle = 'rgba(52, 152, 219, 0.15)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(MAP_SIZE/2, MAP_SIZE/2, 400, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(MAP_SIZE/2, MAP_SIZE/2, 250, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function gameLoop() {
            if (gameStarted && myId && players[myId]) {
                let p = players[myId];
                let dx = 0, dy = 0, speed = 5;
                if (keys.w) dy -= speed;
                if (keys.s) dy += speed;
                if (keys.a) dx -= speed;
                if (keys.d) dx += speed;

                let isMoving = (dx !== 0 || dy !== 0);
                if (isMoving) {
                    socket.emit('move', { x: p.x + dx, y: p.y + dy, isMoving: true });
                } else {
                    socket.emit('move', { x: p.x, y: p.y, isMoving: false });
                }

                // Smooth Interpolation
                for (let id in players) {
                    if (!renderPlayers[id]) {
                        renderPlayers[id] = { x: players[id].x, y: players[id].y, name: players[id].name, avatar: players[id].avatar, outfitColor: players[id].outfitColor, hat: players[id].hat, isMoving: false };
                    }
                    renderPlayers[id].x += (players[id].x - renderPlayers[id].x) * 0.25;
                    renderPlayers[id].y += (players[id].y - renderPlayers[id].y) * 0.25;
                    renderPlayers[id].name = players[id].name;
                    renderPlayers[id].avatar = players[id].avatar;
                    renderPlayers[id].outfitColor = players[id].outfitColor;
                    renderPlayers[id].hat = players[id].hat;
                    renderPlayers[id].isMoving = players[id].isMoving;
                }
                for (let id in renderPlayers) {
                    if (!players[id]) delete renderPlayers[id];
                }

                let me = renderPlayers[myId] || p;
                let camX = me.x - (width / 2);
                let camY = me.y - (height / 2);

                // วาดฉากหลังปราสาท
                drawCastleBackground(camX, camY);

                ctx.save();
                ctx.translate(-camX, -camY);

                // วาดเบี้ยเวทมนตร์บนพื้น
                ctx.font = '18px Kanit'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                tiles.forEach(t => {
                    ctx.fillStyle = t.type === 'num' ? '#f1c40f' : (t.type === 'op' ? '#e74c3c' : '#3498db');
                    ctx.beginPath(); ctx.arc(t.x, t.y, 18, 0, Math.PI * 2); ctx.fill();
                    ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                    ctx.fillStyle = '#ffffff'; ctx.fillText(t.char, t.x, t.y);
                });

                // วาดกล่องสมบัติเวทมนตร์
                mysteryBoxes.forEach(b => {
                    ctx.fillStyle = '#f39c12';
                    ctx.fillRect(b.x - 18, b.y - 18, 36, 36);
                    ctx.lineWidth = 2; ctx.strokeStyle = '#f1c40f'; ctx.strokeRect(b.x - 18, b.y - 18, 36, 36);
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Kanit'; ctx.fillText('?', b.x, b.y);
                });

                // วาดตัวละครผู้เล่นทั้งหมดในปราสาท
                for (let id in renderPlayers) {
                    let pl = renderPlayers[id];
                    drawCastleAvatar(ctx, pl.x, pl.y, pl, pl.isMoving);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 14px Kanit';
                    ctx.textAlign = 'center';
                    ctx.fillText(pl.name, pl.x, pl.y - 50);
                }

                ctx.restore();
            }
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
