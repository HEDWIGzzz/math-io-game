<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <meta name="theme-color" content="#07111f">
  <title>Math.io</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="setupScreen" class="setup-screen">
    <section class="setup-card">
      <div>
        <p class="eyebrow">MULTIPLAYER MATH ADVENTURE</p>
        <h1>Math.io</h1>
        <p class="subtitle">สร้างสมการ ใช้สกิล และปกป้องฐานของทีม</p>
      </div>

      <div class="setup-grid">
        <section class="form-panel">
          <label>
            ชื่อผู้เล่น
            <input id="playerName" maxlength="16" value="นักคำนวณ" autocomplete="off">
          </label>

          <div>
            <span class="field-title">เลือกทีม</span>
            <div id="teamOptions" class="option-grid team-options"></div>
          </div>

          <div>
            <span class="field-title">เลือกสายตัวละคร</span>
            <div id="classOptions" class="class-options"></div>
          </div>

          <div id="classDescription" class="description-box"></div>
        </section>

        <section class="custom-panel">
          <h2>ตกแต่งตัวละคร</h2>
          <canvas id="previewCanvas" width="280" height="280"></canvas>

          <div id="cosmeticControls" class="cosmetic-controls"></div>

          <div class="row">
            <label>
              สีหลัก
              <input id="primaryColor" type="color" value="#3b82f6">
            </label>
            <label>
              สีรอง
              <input id="secondaryColor" type="color" value="#f8fafc">
            </label>
          </div>

          <div class="button-row">
            <button id="randomizeButton" class="secondary-button">สุ่มชุด</button>
            <button id="resetButton" class="secondary-button">คืนค่า</button>
          </div>
        </section>
      </div>

      <p id="setupError" class="error-message"></p>
      <button id="joinButton" class="primary-button">เข้าสู่สนาม</button>
    </section>
  </main>

  <main id="gameScreen" class="game-screen hidden">
    <canvas id="gameCanvas"></canvas>

    <section class="top-hud">
      <div class="hud-card">
        <strong id="identityText">ผู้เล่น</strong>
        <span id="scoreText">คะแนน 0</span>
      </div>
      <div id="baseBars" class="base-bars"></div>
      <div id="leaderboard" class="hud-card leaderboard"></div>
    </section>

    <section class="bottom-hud">
      <div class="hud-card inventory-card">
        <div class="inventory-heading">
          <strong>กระเป๋า</strong>
          <span id="capacityText">0/14</span>
        </div>
        <div id="inventory" class="tile-list"></div>
      </div>

      <div class="hud-card equation-card">
        <strong>สมการ</strong>
        <div id="equationBuilder" class="equation-builder"></div>
        <div class="button-row">
          <button id="clearEquation" class="secondary-button">ล้าง</button>
          <button id="submitEquation" class="primary-button small">ตรวจสมการ</button>
        </div>
      </div>

      <div class="hud-card action-card">
        <button id="activeSkill" class="skill-button">สกิลประจำสาย</button>
        <button id="teamSkill" class="skill-button">สกิลทีม</button>
        <button id="attackButton" class="attack-button">โจมตีฐาน (E)</button>
      </div>
    </section>

    <section id="mobileControls" class="mobile-controls">
      <div class="dpad">
        <button data-key="up">▲</button>
        <button data-key="left">◀</button>
        <button data-key="down">▼</button>
        <button data-key="right">▶</button>
      </div>
      <div class="mobile-actions">
        <button id="mobileSkill">สกิล</button>
        <button id="mobileAttack">E</button>
      </div>
    </section>

    <div id="notice" class="notice"></div>

    <div id="roundOverlay" class="round-overlay hidden">
      <div class="overlay-card">
        <h2 id="winnerText">ทีมชนะ!</h2>
        <p>กำลังเริ่มรอบใหม่</p>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/game-config.js"></script>
  <script src="/character.js"></script>
  <script src="/game.js"></script>
</body>
</html>
